name: Build & push image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# One run at a time, without cancelling: a run must not be stopped halfway through a rollout. This
# and the check below keep an older build from overwriting `latest` and rolling it out, also when its
# CI finished after that of a newer commit.
concurrency:
  group: image

jobs:
  tip:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - id: tip
        name: Is this still the tip of master?
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: $HEAD_SHA is no longer the tip of master, which is $tip"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: tip
    if: ${{ needs.tip.outputs.current == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Image names must be lower case, and GITHUB_REPOSITORY may not be. A fork builds its own image.
      - id: vars
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A failed install must not fail a build that skips the rollout. If it's needed after all,
      # the rollout uses the kubectl from the runner image, or fails when there is none.
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        continue-on-error: true
        with:
          version: v1.37.1

      - name: Roll out the new image
        env:
          KUBE_DEPLOY_TOKEN: ${{ secrets.KUBE_DEPLOY_TOKEN }}
          KUBE_DEPLOY_CA_CERT: ${{ secrets.KUBE_DEPLOY_CA_CERT }}
          KUBE_DEPLOY_SERVER: ${{ secrets.KUBE_DEPLOY_SERVER }}
          KUBE_DEPLOY_NAMESPACE: ${{ vars.KUBE_DEPLOY_NAMESPACE }}
          KUBE_DEPLOY_DEPLOYMENT: ${{ vars.KUBE_DEPLOY_DEPLOYMENT }}
        run: scripts/rollout.sh
